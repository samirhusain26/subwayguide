plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'nyc.subway.board'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'nyc.subway.board'
        minSdk 22
        targetSdk 35
        versionCode 5
        versionName '1.2.2'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    sourceSets {
        main.manifest.srcFile '../src/main/AndroidManifest.xml'
        main.java.srcDirs = ['../src/main/java', '../src/android/java']
        main.res.srcDirs = ['../src/main/res']
        main.assets.srcDir layout.buildDirectory.dir('generated/catalogAssets')
    }

    signingConfigs {
        localDebug {
            storeFile file("${System.getProperty('user.home')}/.local/share/subwayguide/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.localDebug }
        release {
            signingConfig signingConfigs.localDebug
            minifyEnabled false
            shrinkResources false
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        buildPython(System.getenv('CHAQUOPY_BUILD_PYTHON') ?: 'python3.11')
        pip {
            install '-r', '../../server/requirements.txt'
            install 'certifi'
            install 'tzdata'
        }
    }
    sourceSets {
        main {
            srcDir '../src/main/python'
            srcDir layout.buildDirectory.dir('generated/chaquopy/main')
        }
    }
}

tasks.register('stageStationCatalog', Sync) {
    from('../../server/stations.json')
    into(layout.buildDirectory.dir('generated/catalogAssets'))
}

tasks.register('stageServerPython', Sync) {
    from('../../server') {
        exclude 'test_*.py', 'requirements.txt', 'stations.json', 'subway-board.service'
    }
    into(layout.buildDirectory.dir('generated/chaquopy/main'))
}

tasks.named('preBuild').configure {
    dependsOn 'stageStationCatalog', 'stageServerPython'
}

tasks.matching { it.name.endsWith('PythonSources') }.configureEach {
    dependsOn 'stageServerPython'
}

tasks.matching { it.name.endsWith('Assets') && it.name != 'stageStationCatalog' }.configureEach {
    dependsOn 'stageStationCatalog'
}

